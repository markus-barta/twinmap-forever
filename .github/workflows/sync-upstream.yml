name: Sync with upstream

# Keeps main of this fork level with main of catubba/twinmap-forever, as GitHub's "Sync fork" would.
#
# Every hour this merges their main into this main, but only when their changes since the last merge leave
# .github/ alone. A workflow merged into main runs on main, and main is the only branch that reaches the signing
# environment of sign-mac.yml: a change there waits for someone to review it and merge it by hand. Such a run
# fails once, listing the paths; later scheduled runs on the same main only warn, so one blocked merge sends one
# notice. Tags are never fetched: release.yml builds the Windows app for v tags.
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One at a time: a second run finds main already level.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/catubba/twinmap-forever.git

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the merge to main
      actions: read # to find an earlier failed run on the same main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Merge their main when it leaves .github/ alone
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet "$UPSTREAM" main
          theirs=$(git rev-parse FETCH_HEAD) ours=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$theirs" "$ours"; then
            echo "main already holds ${theirs:0:7} of their main."
            exit 0
          fi
          base=$(git merge-base "$ours" "$theirs")
          # Without rename detection, so a file moved out of .github/ counts as well.
          paths=$(git diff --no-renames --name-only "$base" "$theirs" -- .github)
          if [ -n "$paths" ]; then
            {
              echo "### Not merged: their main changes .github/"
              echo "Their main ${theirs:0:7} changes, since ${base:0:7}:"
              echo '```'
              echo "$paths"
              echo '```'
              echo "Review with \`git diff --no-renames $base $theirs -- .github\`, then merge by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            failed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow sync-upstream.yml --commit "$ours" --status failure --limit 1 --json databaseId --jq length)
            if [ "$EVENT" = schedule ] && [ "$failed" != 0 ]; then
              echo "::warning::Still waiting for a review of their .github/ changes (reported in an earlier run)."
              exit 0
            fi
            echo "::error::Their main ${theirs:0:7} changes .github/: $(echo "$paths" | tr '\n' ' ')- review it and merge by hand."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-ff --no-edit -m "Merge catubba/twinmap-forever main (${theirs:0:7})" "$theirs"; then
            git merge --abort
            echo "::error::Their main ${theirs:0:7} does not merge cleanly into main. Merge by hand."
            exit 1
          fi
          git push origin HEAD:main
          echo "Merged their main ${theirs:0:7} into main."
